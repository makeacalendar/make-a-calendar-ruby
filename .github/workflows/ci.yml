name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install rubocop -v 1.62.1 --no-document
      - run: chmod +x exe/make-calendar
      - run: rubocop --lint lib exe
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.7", "3.2", "3.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby -Ilib spec/all_spec.rb
      - run: find lib exe spec examples -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - run: gem build make_a_calendar_toolkit.gemspec
      - run: ruby -rrubygems/package -e 'spec = Gem::Specification.load("make_a_calendar_toolkit.gemspec"); files = Gem::Package.new("make_a_calendar_toolkit-#{spec.version}.gem").spec.files; abort "required package files are missing" unless files.include?("README.md") && files.include?("lib/make_a_calendar.rb")'
      - run: ruby -Ilib exe/make-calendar --help
